# Cromwell Local 后端配置
# 为原始 WDL 测试启用 Docker，并挂载本地数据目录到容器内
include required(classpath("application"))

backend {
  default = "Local"
  providers {
    Local {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        run-in-background = true

        runtime-attributes = """
          String? docker
          String? docker_user
        """

        # 默认 docker 运行命令，增加本地数据目录挂载
        submit-docker = """
          docker run \
            --cidfile ${cwd}/docker_cid \
            -i \
            ${"--user " + docker_user} \
            --entrypoint /bin/bash \
            -v ${cwd}:${docker_cwd}:delegated \
            -v /home/xydeng/Metagenomics_Docker:/home/xydeng/Metagenomics_Docker:ro \
            -v /home/xydeng/Metagenomics_Docker/WDL_original/cromwell-executions:/cromwell-executions \
            -v /cephfs_data/genostack_v3/genostack_php/public_file_data/metagenome-DB:/cephfs_data/genostack_v3/genostack_php/public_file_data/metagenome-DB:ro \
            ${docker} ${docker_cwd}/execution/script
        """

        submit = "/bin/bash ${script}"
        root = "cromwell-executions"
        dockerRoot = "/cromwell-executions"

        filesystems {
          local {
            localization: ["hard-link", "soft-link", "copy"]
          }
        }
      }
    }
  }
}

call-caching {
  enabled = true
  invalidate-bad-cache-results = true
}

database {
  profile = "slick.jdbc.HsqldbProfile$"
  db {
    driver = "org.hsqldb.jdbcDriver"
    url = "jdbc:hsqldb:file:/home/xydeng/Metagenomics_Docker/WDL_original/cromwell-db/cromwell-db;shutdown=false;hsqldb.tx=mvcc"
    user = "sa"
    password = ""
    numThreads = 1
  }
}

workflow-options {
  workflow-failure-mode = "ContinueWhilePossible"
}
